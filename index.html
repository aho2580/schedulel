<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>くらしノート</title>
<style>
:root{--theme:#222222;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f7fb;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif}
body{padding-bottom:80px}
button,input,select{font:inherit}
button{cursor:pointer}
header{background:#fff;padding:20px 16px 12px;border-bottom:1px solid #e5e7eb}
h1{margin:0;font-size:24px}.sub{margin-top:4px;color:#666;font-size:13px}
.tabs{display:flex;gap:8px;padding:10px 12px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #e5e7eb}
.tab{flex:1;border:0;border-radius:12px;padding:10px 4px;background:#f0f2f5;color:#555}.tab.active{background:var(--theme);color:#fff}
main{max-width:760px;margin:0 auto;padding:14px}.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0000000d;overflow:hidden;color:#222}
.card h2{font-size:17px;margin:0 0 12px;color:#222}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px;border-radius:13px;background:#f6f7f9}.stat .label{font-size:12px;color:#666}.stat .num{font-size:22px;font-weight:700;margin-top:5px;color:#222}
.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--theme);color:#fff}.btn.light{background:#eef0f3;color:#222}
.row{display:flex;align-items:center;gap:8px}.space{justify-content:space-between}.small{font-size:12px;color:#666}
.list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:100%;min-width:0}
.item{display:flex;align-items:center;gap:8px;width:100%;max-width:100%;min-width:0;padding:10px;border:1px solid #e5e7eb;border-radius:11px;background:#fff;overflow:hidden;color:#222}
.grow{flex:1;min-width:0;color:#222;overflow-wrap:anywhere;word-break:break-word}.item b{color:#222}
.item .del{border:0;background:#f0f2f5;border-radius:8px;padding:6px 8px;color:#444;flex:none}
.done{text-decoration:line-through;color:#888!important}
input,select{width:100%;border:1px solid #d8dce2;border-radius:10px;padding:10px;background:#fff;color:#222}
.form{display:grid;gap:9px}

.daynum.holiday{color:#e53935;font-weight:700}
.daynum.saturday{color:#2563eb}
.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calendar-head button{border:0;background:#eef0f3;border-radius:9px;padding:7px 10px}
.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:11px;color:#777;padding:4px 0}
.day{min-width:0;min-height:52px;border:1px solid #e5e7eb;border-radius:9px;background:#fff;padding:6px;text-align:left;color:#222}
.day.empty{background:#fafafa;border-style:dashed}.day.selected{outline:2px solid #222}.day.today{background:#f0f2f5}
.daynum{font-size:13px;font-weight:700}.dotline{display:flex;gap:2px;margin-top:5px}.dot{width:6px;height:6px;border-radius:50%}
.event-label{border-left:4px solid var(--event-color,#222);padding-left:7px}
.money-income{border-left:4px solid #22c55e;padding-left:7px}.money-expense{border-left:4px solid #ef4444;padding-left:7px}
.modal-bg{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end;justify-content:center}.modal-bg.show{display:flex}
.modal{background:#fff;width:min(760px,100%);border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}.modal h3{margin:0 0 12px}
.close{float:right;border:0;background:#eef0f3;border-radius:9px;padding:5px 9px}
.color-row{display:grid;grid-template-columns:1fr 58px 42px;gap:7px;align-items:center}
.color-picker{width:58px;height:42px;padding:3px}
@media(min-width:600px){.modal-bg{align-items:center}.modal{border-radius:18px}}
</style>

<style>
html,body{color:var(--theme)}
.card{color:var(--theme)}
.card h2{color:var(--theme)}
.stat .num{color:var(--theme)}
.btn.light{color:var(--theme)}
.item{color:var(--theme)}
.grow,.item b{color:var(--theme)}
input,select{color:var(--theme)}
.day{color:var(--theme)}
.day.selected{outline-color:var(--theme)}
</style>

<style>.daynum:not(.holiday):not(.saturday){color:#222!important}</style>

<style>
/* ダーク背景：元の機能・レイアウトは維持して背景色のみ暗色化 */
html,body{background:#000!important;color:#f5f5f5}
header,.tabs{background:#111!important;border-color:#333!important}
header h1,.sub{color:#f5f5f5}
.card{background:#151515!important;color:#f5f5f5!important;box-shadow:0 2px 10px #0008}
.card h2,.stat .num,.item,.grow,.item b{color:#f5f5f5}
.stat{background:#252525!important}
.stat .label,.small{color:#c7c7c7}
.btn.light,.calendar-head button,.close,.item .del{background:#333!important;color:#f5f5f5!important}
.item{background:#202020!important;border-color:#3a3a3a!important}
input,select{background:#222!important;color:#f5f5f5!important;border-color:#555!important}
.day{background:#1b1b1b!important;color:#f5f5f5!important;border-color:#444!important}
.day.empty{background:#101010!important}
.day.today{background:#303030!important}
.day.selected{outline-color:var(--theme)!important}
.week div{color:#c7c7c7!important}
.daynum:not(.holiday):not(.saturday){color:#f5f5f5!important}
.daynum.holiday{color:#ff5252!important}
.daynum.saturday{color:#60a5fa!important}
.modal{background:#151515!important;color:#f5f5f5!important}
.modal h2,.modal h3{color:#f5f5f5!important}
.done{color:#aaa!important}
.theme-preset{background:#333;color:#fff;border:1px solid #666;border-radius:8px;padding:8px}
</style>


<style>
/* 日付以外の文字はテーマ色に統一。日付の曜日色は維持する */
body, header h1, .sub, .card, .card h2, .stat .num, .item, .grow, .item b,
.small, .stat .label, .calendar-head b, .week div, .modal, .modal h2, .modal h3,
label, p, .list, .event-label, .money-income, .money-expense {
  color: var(--theme) !important;
}
.btn.light, .close, .calendar-head button, .item .del {
  color: var(--theme) !important;
}
input, select, textarea {
  color: var(--theme) !important;
}
.day { color: var(--theme) !important; }
/* 平日・土日祝の日付だけは専用色を優先 */
.daynum:not(.holiday):not(.saturday) { color: #f5f5f5 !important; }
.daynum.holiday { color: #ff5252 !important; }
.daynum.saturday { color: #60a5fa !important; }
/* 完了済みTo Doは判読性を保つ */
.done { color: var(--theme) !important; opacity: .65; }
</style>

</head>
<body>
<header><h1>くらしノート</h1><div class="sub">予定・お金・To Doをひとつに</div><button type="button" class="btn light" id="openThemeSettings" style="margin-top:8px">🎨 テーマの色</button></header>
<nav class="tabs">
<button class="tab active" data-page="home">ホーム</button>
<button class="tab" data-page="calendar">カレンダー</button>
<button class="tab" data-page="money">家計簿</button>
<button class="tab" data-page="todo">To Do</button>
</nav>
<main>
<section id="home" class="page active">
<div class="card"><h2>今日</h2><div id="homeDate"></div></div>
<div class="card"><h2>今月のお金</h2><div class="grid2"><div class="stat"><div class="label">収入</div><div class="num" id="homeIncome">¥0</div></div><div class="stat"><div class="label">支出</div><div class="num" id="homeExpense">¥0</div></div></div></div>
<div class="card"><div class="row space"><h2>今日の予定</h2><button class="btn" id="homeAddEvent">＋予定</button></div><div id="homeEvents" class="list"></div></div>
<div class="card"><h2>今日のTo Do</h2><div id="homeTodos" class="list"></div></div>
</section>

<section id="calendar" class="page">
<div class="card">
<div class="calendar-head"><button id="prevMonth">‹</button><b id="monthTitle"></b><button id="nextMonth">›</button></div>
<div style="margin-bottom:10px"><button class="btn light" id="openColorSettings">⚙️ 予定の種類・色を設定</button></div>
<div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
<div id="calendarGrid" class="calendar"></div>
</div>
<div class="card">
<div class="row space"><h2 id="selectedTitle">選択した日の内容</h2><button class="btn" id="addEvent">＋予定</button></div>
<div class="small" style="margin-bottom:8px">予定</div><div id="selectedEvents" class="list"></div>
<div class="small" style="margin:14px 0 8px">To Do</div><div id="selectedTodos" class="list"></div>
<div class="small" style="margin:14px 0 8px">お金</div><div id="selectedMoney" class="list"></div>
</div>
</section>

<section id="money" class="page">
<div class="card"><h2>今月の家計簿</h2><div class="grid2"><div class="stat"><div class="label">収入</div><div class="num" id="moneyIncome">¥0</div></div><div class="stat"><div class="label">支出</div><div class="num" id="moneyExpense">¥0</div></div></div></div>
<div class="card"><h2>追加</h2><form id="moneyForm" class="form">
<input id="moneyDate" type="date" required><select id="moneyType"><option value="expense">支出</option><option value="income">収入</option></select>
<input id="moneyTitle" placeholder="内容" required><input id="moneyAmount" type="number" min="0" placeholder="金額" required><input id="moneyCategory" placeholder="カテゴリ（食費など）">
<button class="btn">追加する</button></form></div>
<div class="card"><h2>一覧</h2><div id="moneyList" class="list"></div></div>
</section>

<section id="todo" class="page">
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>To Doを追加</h2><button type="button" class="btn light" id="openTodoColorSettings">⚙️ 種類・色</button></div><form id="todoForm" class="form">
<input id="todoDate" type="date" required><input id="todoTitle" placeholder="やること" required><select id="todoPriority"><option>普通</option><option>高</option><option>低</option></select>
<select id="todoType"></select>
<button class="btn">追加する</button></form></div>
<div class="card"><h2>一覧</h2><div id="todoList" class="list"></div></div>
</section>
</main>

<div id="modalBg" class="modal-bg"><div class="modal">
<button class="close" id="closeModal">閉じる</button><h3>予定を追加</h3>
<form id="eventForm" class="form"><input id="eventDate" type="date" required><input id="eventTitle" placeholder="予定の名前" required><input id="eventTime" type="time"><select id="eventColor"></select><button class="btn">追加する</button></form>
</div></div>

<div id="settingsBg" class="modal-bg"><div class="modal">
<button class="close" id="closeSettings">閉じる</button><h3>予定の種類・色を設定</h3>
<div class="small" style="margin-bottom:10px">種類名と色を自由に変更できます。</div>
<div id="colorSettingsList" class="list"></div>
<button class="btn" id="addColorType" style="margin-top:10px">＋種類を追加</button>
</div></div>


<div class="modal-bg" id="todoColorSettingsBg" style="display:none">
  <div class="modal card">
    <h2>To Doの種類・色を設定</h2>
    <div id="todoColorSettingsList"></div>
    <button class="btn light" id="addTodoColorType">＋ 種類を追加</button>
    <button class="btn" id="closeTodoColorSettings">閉じる</button>
  </div>
</div>

<div class="modal-bg" id="themeSettingsBg" style="display:none">
  <div class="modal card">
    <h2>テーマの色を設定</h2>
    <input id="themeColorInput" type="color" value="#222222" style="width:100%;height:50px">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0">
      <button type="button" class="theme-preset" data-color="#222222">黒</button>
      <button type="button" class="theme-preset" data-color="#2563eb">青</button>
      <button type="button" class="theme-preset" data-color="#16a34a">緑</button>
      <button type="button" class="theme-preset" data-color="#9333ea">紫</button>
      <button type="button" class="theme-preset" data-color="#e11d48">ピンク</button>
      <button type="button" class="theme-preset" data-color="#ea580c">オレンジ</button>
    </div>
    <button class="btn light" id="resetThemeColor">標準に戻す</button>
    <button class="btn" id="closeThemeSettings">閉じる</button>
  </div>
</div>

<script>
const KEY="kurashi_note_clean_v5";
const TODO_TYPES_KEY="kurashi_note_todo_types_v1";
const THEME_KEY="kurashi_note_theme_v1";
const DEFAULT_TODO_TYPES=[
  {name:"通常",color:"#222222"},
  {name:"学校・勉強",color:"#3b82f6"},
  {name:"家のこと",color:"#22c55e"},
  {name:"大事",color:"#f97316"},
  {name:"その他",color:"#ec4899"}
];
let todoTypes=JSON.parse(localStorage.getItem(TODO_TYPES_KEY)||"null")||DEFAULT_TODO_TYPES;
let themeColor=localStorage.getItem(THEME_KEY)||"#222222";
document.documentElement.style.setProperty("--theme",themeColor);

function saveTodoTypes(){localStorage.setItem(TODO_TYPES_KEY,JSON.stringify(todoTypes));}
function populateTodoTypes(){
  const s=document.getElementById("todoType");
  if(!s)return;
  s.innerHTML=todoTypes.map((t,i)=>`<option value="${i}">${escapeHtml(t.name)}</option>`).join("");
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function renderTodoTypeSettings(){
  const box=document.getElementById("todoColorSettingsList");
  if(!box)return;
  box.innerHTML=todoTypes.map((t,i)=>`
    <div style="display:flex;gap:6px;align-items:center;margin:8px 0">
      <input class="todo-type-name" data-i="${i}" value="${escapeHtml(t.name)}" style="flex:1;min-width:0">
      <input class="todo-type-color" data-i="${i}" type="color" value="${t.color}" style="width:46px;height:40px;padding:2px">
      <button type="button" class="btn light delete-todo-type" data-i="${i}">削除</button>
    </div>`).join("");
}
function saveTodoTypeInputs(){
  document.querySelectorAll(".todo-type-name").forEach(el=>{
    const i=Number(el.dataset.i);
    if(todoTypes[i])todoTypes[i].name=el.value.trim()||"無題";
  });
  document.querySelectorAll(".todo-type-color").forEach(el=>{
    const i=Number(el.dataset.i);
    if(todoTypes[i])todoTypes[i].color=el.value;
  });
  saveTodoTypes(); populateTodoTypes();
  if(typeof render==="function")render();
}
function applyTheme(c){
  themeColor=c;
  document.documentElement.style.setProperty("--theme",c);
  localStorage.setItem(THEME_KEY,c);
  const input=document.getElementById("themeColorInput");
  if(input)input.value=c;
}

const today=new Date(), pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const yen=n=>"¥"+Number(n||0).toLocaleString("ja-JP");
const DEFAULT_COLORS=[
{id:"black",name:"通常",color:"#222222"},
{id:"blue",name:"学校・勉強",color:"#3b82f6"},
{id:"green",name:"お出かけ",color:"#22c55e"},
{id:"orange",name:"大事な予定",color:"#f97316"},
{id:"pink",name:"その他",color:"#ec4899"}
];

let data=JSON.parse(localStorage.getItem(KEY)||'{"events":[],"todos":[],"money":[]}');
data.todos=(data.todos||[]).map(t=>{
  if(t.type===undefined || t.type===null) t.type=0;
  if(Number(t.type)>=todoTypes.length)t.type=0;
  return t;
});

let colorTypes=JSON.parse(localStorage.getItem("kurashi_note_color_types_v2")||"null")||DEFAULT_COLORS;
let selectedDate=iso(today),viewYear=today.getFullYear(),viewMonth=today.getMonth();

function save(){localStorage.setItem(KEY,JSON.stringify(data));renderAll()}
function saveColors(){localStorage.setItem("kurashi_note_color_types_v2",JSON.stringify(colorTypes))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function getColor(id){return colorTypes.find(x=>x.id===id)||colorTypes[0]}

function renderColorSelect(){
 const s=document.getElementById("eventColor");
 s.innerHTML=colorTypes.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("");
}
function renderColorSettings(){
 const el=document.getElementById("colorSettingsList");
 el.innerHTML=colorTypes.map((x,i)=>`<div class="item color-setting" data-index="${i}">
 <div class="grow"><div class="color-row">
 <input class="type-name" value="${esc(x.name)}" placeholder="種類の名前">
 <input class="color-picker" type="color" value="${x.color}">
 <button class="del color-delete" ${colorTypes.length<=1?"disabled":""}>削除</button>
 </div></div></div>`).join("");
}
function renderHome(){
 document.getElementById("homeDate").textContent=today.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
 const ym=iso(today).slice(0,7);let inc=0,exp=0;
 data.money.filter(x=>x.date.startsWith(ym)).forEach(x=>x.type==="income"?inc+=+x.amount:exp+=+x.amount);
 document.getElementById("homeIncome").textContent=yen(inc);document.getElementById("homeExpense").textContent=yen(exp);
 renderEvents("homeEvents",iso(today));renderTodos("homeTodos",iso(today));
}
function renderEvents(id,date){
 const el=document.getElementById(id),arr=data.events.filter(x=>x.date===date);
 el.innerHTML=arr.length?arr.map(x=>`<div class="item"><div class="grow event-label" style="--event-color:${getColor(x.color).color}"><b>${esc(x.time||"時間未定")}</b>　${esc(x.title)}<br><span class="small">${esc(getColor(x.color).name)}</span></div><button class="del" data-kind="event" data-id="${x.id}">削除</button></div>`).join(""):'<div class="small">予定はありません</div>';
}
function renderTodos(id,date){
 const el=document.getElementById(id),arr=data.todos.filter(x=>x.date===date);
 el.innerHTML=arr.length?arr.map(x=>`<div class="item"><input type="checkbox" style="width:auto" data-kind="todoToggle" data-id="${x.id}" ${x.done?"checked":""}><div class="grow ${x.done?"done":""}"><b>${esc(x.title)}</b><br><span class="small">優先度：${esc(x.priority)}</span></div><button class="del" data-kind="todo" data-id="${x.id}">削除</button></div>`).join(""):'<div class="small">To Doはありません</div>';
}

function holidayName(y,m,d){
  // m is 1-12. Japanese national holidays, including moving holidays
  // and substitute holidays. This keeps the calendar useful across years.
  const fixed={
    "1-1":"元日","2-11":"建国記念の日","2-23":"天皇誕生日",
    "4-29":"昭和の日","5-3":"憲法記念日","5-4":"みどりの日","5-5":"こどもの日",
    "8-11":"山の日","11-3":"文化の日","11-23":"勤労感謝の日"
  };
  const key=`${m}-${d}`;
  if(fixed[key]) return fixed[key];

  // Happy Monday holidays
  const nthMonday=(month,n)=>{
    const first=new Date(y,month-1,1);
    return 1+((8-first.getDay())%7)+(n-1)*7;
  };
  if(m===1 && d===nthMonday(1,2)) return "成人の日";
  if(m===7 && d===nthMonday(7,3)) return "海の日";
  if(m===9 && d===nthMonday(9,3)) return "敬老の日";
  if(m===10 && d===nthMonday(10,2)) return "スポーツの日";

  // Vernal/autumnal equinox (official dates can be confirmed by the government;
  // this astronomical approximation is accurate for normal calendar years).
  const vernal=Math.floor(20.8431+0.242194*(y-1980)-Math.floor((y-1980)/4));
  const autumn=Math.floor(23.2488+0.242194*(y-1980)-Math.floor((y-1980)/4));
  if(m===3 && d===vernal) return "春分の日";
  if(m===9 && d===autumn) return "秋分の日";

  // 2020 Olympics special one-off changes.
  if(y===2020){
    if(m===7&&d===23)return "海の日";
    if(m===7&&d===24)return "スポーツの日";
    if(m===8&&d===10)return "山の日";
  }
  if(y===2021){
    if(m===7&&d===22)return "海の日";
    if(m===7&&d===23)return "スポーツの日";
    if(m===8&&d===8)return "山の日";
  }

  return "";
}
function isHoliday(y,m,d){
  if(holidayName(y,m,d)) return true;

  // Substitute holiday: when a national holiday falls on Sunday,
  // the next non-holiday weekday becomes a holiday.
  const cur=new Date(y,m-1,d);
  for(let offset=1;offset<=7;offset++){
    const prev=new Date(y,m-1,d-offset);
    if(prev.getFullYear()!==y) break;
    if(prev.getDay()!==0) break;
    if(holidayName(y,prev.getMonth()+1,prev.getDate())) return true;
  }

  // Citizen's holiday: a weekday between two national holidays.
  if(cur.getDay()!==0 && cur.getDay()!==6){
    const before=new Date(y,m-1,d-1), after=new Date(y,m-1,d+1);
    if(holidayName(y,before.getMonth()+1,before.getDate()) &&
       holidayName(y,after.getMonth()+1,after.getDate())) return true;
  }
  return false;
}

function renderCalendar(){
 document.getElementById("monthTitle").textContent=`${viewYear}年${viewMonth+1}月`;
 const grid=document.getElementById("calendarGrid");grid.innerHTML="";
 const first=new Date(viewYear,viewMonth,1);
 for(let i=0;i<first.getDay();i++)grid.insertAdjacentHTML("beforeend",'<div class="day empty"></div>');
 const days=new Date(viewYear,viewMonth+1,0).getDate();
 for(let n=1;n<=days;n++){
  const date=`${viewYear}-${pad(viewMonth+1)}-${pad(n)}`,evs=data.events.filter(x=>x.date===date),td=data.todos.some(x=>x.date===date),mo=data.money.some(x=>x.date===date);
  const cls="day"+(date===selectedDate?" selected":"")+(date===iso(today)?" today":"");
  grid.insertAdjacentHTML("beforeend",`<button class="${cls}" data-date="${date}"><div class="daynum ${isHoliday(viewYear,viewMonth+1,n)||new Date(viewYear,viewMonth,n).getDay()===0?"holiday":new Date(viewYear,viewMonth,n).getDay()===6?"saturday":""}">${n}</div><div class="dotline">${evs.map(x=>`<i class="dot" style="background:${getColor(x.color).color}"></i>`).join("")}${td?'<i class="dot" style="background:var(--theme)"></i>':""}${mo?'<i class="dot" style="background:#777"></i>':""}</div></button>`);
 }
}
function renderSelected(){
 document.getElementById("selectedTitle").textContent=new Date(selectedDate+"T00:00:00").toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
 renderEvents("selectedEvents",selectedDate);renderTodos("selectedTodos",selectedDate);
 const el=document.getElementById("selectedMoney"),arr=data.money.filter(x=>x.date===selectedDate);
 el.innerHTML=arr.length?arr.map(x=>`<div class="item"><div class="grow ${x.type==="income"?"money-income":"money-expense"}"><b>${x.type==="income"?"収入":"支出"}　${yen(x.amount)}</b><br>${esc(x.title)}${x.category?`　<span class="small">${esc(x.category)}</span>`:""}</div><button class="del" data-kind="money" data-id="${x.id}">削除</button></div>`).join(""):'<div class="small">記録はありません</div>';
}
function renderMoney(){
 const ym=`${viewYear}-${pad(viewMonth+1)}`;let inc=0,exp=0;
 data.money.filter(x=>x.date.startsWith(ym)).forEach(x=>x.type==="income"?inc+=+x.amount:exp+=+x.amount);
 document.getElementById("moneyIncome").textContent=yen(inc);document.getElementById("moneyExpense").textContent=yen(exp);
 const arr=[...data.money].sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById("moneyList").innerHTML=arr.length?arr.map(x=>`<div class="item"><div class="grow ${x.type==="income"?"money-income":"money-expense"}"><b>${esc(x.date)}　${x.type==="income"?"収入":"支出"} ${yen(x.amount)}</b><br>${esc(x.title)}${x.category?`　<span class="small">${esc(x.category)}</span>`:""}</div><button class="del" data-kind="money" data-id="${x.id}">削除</button></div>`).join(""):'<div class="small">まだありません</div>';
}
function renderTodoList(){
 const arr=[...data.todos].sort((a,b)=>a.date.localeCompare(b.date));
 document.getElementById("todoList").innerHTML=arr.length?arr.map(x=>`<div class="item"><input type="checkbox" style="width:auto" data-kind="todoToggle" data-id="${x.id}" ${x.done?"checked":""}><div class="grow ${x.done?"done":""}"><b>${esc(x.date)}　${esc(x.title)}</b><br><span class="small">優先度：${esc(x.priority)}</span></div><button class="del" data-kind="todo" data-id="${x.id}">削除</button></div>`).join(""):'<div class="small">まだありません</div>';
}
function renderAll(){renderColorSelect();renderHome();renderCalendar();renderSelected();renderMoney();renderTodoList()}

document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");document.getElementById(btn.dataset.page).classList.add("active");
}));
document.getElementById("prevMonth").onclick=()=>{viewMonth--;if(viewMonth<0){viewMonth=11;viewYear--}renderAll()};
document.getElementById("nextMonth").onclick=()=>{viewMonth++;if(viewMonth>11){viewMonth=0;viewYear++}renderAll()};
document.getElementById("calendarGrid").addEventListener("click",e=>{const b=e.target.closest("[data-date]");if(!b)return;selectedDate=b.dataset.date;renderCalendar();renderSelected()});

function openEventModal(date){
 document.getElementById("eventDate").value=date;document.getElementById("eventTitle").value="";document.getElementById("eventTime").value="";
 renderColorSelect();document.getElementById("eventColor").value=colorTypes[0].id;document.getElementById("modalBg").classList.add("show");
}
document.getElementById("addEvent").onclick=()=>openEventModal(selectedDate);
document.getElementById("homeAddEvent").onclick=()=>openEventModal(iso(today));
document.getElementById("closeModal").onclick=()=>document.getElementById("modalBg").classList.remove("show");
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")e.currentTarget.classList.remove("show")});

document.getElementById("eventForm").addEventListener("submit",e=>{
 e.preventDefault();
 data.events.push({id:Date.now(),date:eventDate.value,title:eventTitle.value,time:eventTime.value,color:eventColor.value});
 document.getElementById("modalBg").classList.remove("show");save();
});

document.getElementById("openColorSettings").onclick=()=>{renderColorSettings();document.getElementById("settingsBg").classList.add("show")};
document.getElementById("closeSettings").onclick=()=>document.getElementById("settingsBg").classList.remove("show");
document.getElementById("settingsBg").addEventListener("click",e=>{if(e.target.id==="settingsBg")e.currentTarget.classList.remove("show")});
document.getElementById("addColorType").onclick=()=>{
 colorTypes.push({id:"custom_"+Date.now(),name:"新しい種類",color:"#8b5cf6"});saveColors();renderColorSettings();renderColorSelect();
};
document.getElementById("colorSettingsList").addEventListener("input",e=>{
 const row=e.target.closest(".color-setting");if(!row)return;const i=Number(row.dataset.index);
 if(e.target.classList.contains("type-name"))colorTypes[i].name=e.target.value||"新しい種類";
 if(e.target.classList.contains("color-picker"))colorTypes[i].color=e.target.value;
 saveColors();renderColorSelect();renderCalendar();renderSelected();renderHome();
});
document.getElementById("colorSettingsList").addEventListener("click",e=>{
 if(!e.target.classList.contains("color-delete"))return;
 const row=e.target.closest(".color-setting");colorTypes.splice(Number(row.dataset.index),1);saveColors();
 renderColorSettings();renderColorSelect();renderCalendar();renderSelected();renderHome();
});

document.getElementById("moneyForm").addEventListener("submit",e=>{
 e.preventDefault();data.money.push({id:Date.now(),date:moneyDate.value,type:moneyType.value,title:moneyTitle.value,amount:Number(moneyAmount.value),category:moneyCategory.value});
 e.target.reset();moneyDate.value=iso(today);save();
});
document.getElementById("todoForm").addEventListener("submit",e=>{
 e.preventDefault();data.todos.push({id:Date.now(),date:todoDate.value,title:todoTitle.value,priority:todoPriority.value,type:Number(todoType.value||0),done:false});
 e.target.reset();todoDate.value=iso(today);save();
});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-kind]");if(!b)return;const id=Number(b.dataset.id),k=b.dataset.kind;
 if(k==="event")data.events=data.events.filter(x=>x.id!==id);
 if(k==="money")data.money=data.money.filter(x=>x.id!==id);
 if(k==="todo")data.todos=data.todos.filter(x=>x.id!==id);
 if(k==="todoToggle"){const x=data.todos.find(x=>x.id===id);if(x)x.done=b.checked}
 save();
});

moneyDate.value=iso(today);todoDate.value=iso(today);eventDate.value=selectedDate;renderAll();

populateTodoTypes();

document.getElementById("openTodoColorSettings")?.addEventListener("click",()=>{
  renderTodoTypeSettings();
  document.getElementById("todoColorSettingsBg").style.display="flex";
});
document.getElementById("closeTodoColorSettings")?.addEventListener("click",()=>{
  saveTodoTypeInputs();
  document.getElementById("todoColorSettingsBg").style.display="none";
});
document.getElementById("addTodoColorType")?.addEventListener("click",()=>{
  saveTodoTypeInputs();
  todoTypes.push({name:"新しい種類",color:"#64748b"});
  saveTodoTypes();
  renderTodoTypeSettings();
  populateTodoTypes();
});
document.getElementById("todoColorSettingsBg")?.addEventListener("click",e=>{
  if(e.target.id==="todoColorSettingsBg"){
    saveTodoTypeInputs();
    e.target.style.display="none";
  }
});
document.addEventListener("click",e=>{
  const b=e.target.closest(".delete-todo-type");
  if(!b)return;
  const i=Number(b.dataset.i);
  if(todoTypes.length<=1)return;
  todoTypes.splice(i,1);
  data.todos.forEach(t=>{if(Number(t.type)===i)t.type=0;else if(Number(t.type)>i)t.type--;});
  saveTodoTypes();
  localStorage.setItem(KEY,JSON.stringify(data));
  renderTodoTypeSettings();
  populateTodoTypes();
  if(typeof render==="function")render();
});
document.getElementById("openThemeSettings")?.addEventListener("click",()=>{
  document.getElementById("themeColorInput").value=themeColor;
  document.getElementById("themeSettingsBg").style.display="flex";
});
document.getElementById("themeColorInput")?.addEventListener("input",e=>applyTheme(e.target.value));
document.querySelectorAll(".theme-preset").forEach(b=>b.addEventListener("click",()=>applyTheme(b.dataset.color)));
document.getElementById("resetThemeColor")?.addEventListener("click",()=>applyTheme("#222222"));
document.getElementById("closeThemeSettings")?.addEventListener("click",()=>document.getElementById("themeSettingsBg").style.display="none");
document.getElementById("themeSettingsBg")?.addEventListener("click",e=>{
  if(e.target.id==="themeSettingsBg")e.target.style.display="none";
});

</script>
</body>
</html>
